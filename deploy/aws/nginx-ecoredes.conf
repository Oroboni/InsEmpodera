# Nginx da EC2: recebe o tráfego do Amazon CloudFront (HTTPS para o público) e repassa ao contêiner.
# O Security Group só libera a porta 80 para a lista de IPs do CloudFront, então toda requisição
# que chega aqui veio por HTTPS: por isso X-Forwarded-Proto é fixo em https.
server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Importação do backup geral aceita planilhas de até 100 MB.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
