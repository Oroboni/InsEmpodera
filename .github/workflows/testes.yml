name: Testes de backend e banco

# main.yml continua responsável apenas pelas branches legadas de importação
# e pela publicação do aplicativo. Este workflow cobre as demais branches.
on:
  workflow_dispatch:
  push:
    branches-ignore: [import_exel, Import_exel]
  pull_request:
    branches-ignore: [import_exel, Import_exel]

permissions:
  contents: read

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testes_empodera
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar o .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Cache do NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Executar testes de backend e banco
        shell: pwsh
        env:
          TEST_MYSQL_CONNECTION: Server=127.0.0.1;Port=3306;User=root;Password=testes_empodera;Allow User Variables=true
        run: ./testar.ps1

      - name: Publicar resultados e cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultados-testes-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            TestResults/**

  chave-estrangeira:
    name: FK da ficha de primeiro contato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testes_empodera
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar o .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Verificar a FK no MySQL
        env:
          TEST_MYSQL_CONNECTION: Server=127.0.0.1;Port=3306;User=root;Password=testes_empodera;Allow User Variables=true
        run: dotnet test scripts/ForeignKey.Tests/ForeignKey.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  banco-mysql:
    name: Compatibilidade com MySQL 8.4 LTS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testes_empodera
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar o .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Executar integrações no mesmo banco usado em produção
        id: testes_mysql
        continue-on-error: true
        shell: pwsh
        env:
          TEST_MYSQL_CONNECTION: Server=127.0.0.1;Port=3306;User=root;Password=testes_empodera;Allow User Variables=true
        run: >-
          dotnet test InsEmpodera.Tests/InsEmpodera.Tests.csproj
          --configuration Release
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=resultado-compatibilidade-mysql.trx"
          --results-directory TestResults/04-mysql

      - name: Gerar diagnóstico preciso do MySQL
        if: always()
        shell: pwsh
        run: |
          ./scripts/Gerar-RelatorioTestes.ps1 `
            -MySqlTrx "TestResults/04-mysql/resultado-compatibilidade-mysql.trx" `
            -Saida "TestResults/04-mysql/RELATORIO-COMPATIBILIDADE-MYSQL.md" `
            -SaidaJson "TestResults/04-mysql/DIAGNOSTICO-COMPATIBILIDADE-MYSQL.json"

          if ($env:GITHUB_STEP_SUMMARY) {
            Get-Content "TestResults/04-mysql/RELATORIO-COMPATIBILIDADE-MYSQL.md" -Raw |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

          if (-not (Select-String `
              -LiteralPath "TestResults/04-mysql/RELATORIO-COMPATIBILIDADE-MYSQL.md" `
              -SimpleMatch '**Resultado geral:** APROVADO' `
              -Quiet)) {
            Write-Error "O diagnóstico MySQL identificou falha ou resultado ausente."
            exit 1
          }

      - name: Confirmar resultado da compatibilidade MySQL
        if: steps.testes_mysql.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Os testes com MySQL falharam. Consulte as anotações e o diagnóstico acima."
          exit 1

      - name: Publicar resultado do banco MySQL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultado-compatibilidade-mysql-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: TestResults/04-mysql/**
