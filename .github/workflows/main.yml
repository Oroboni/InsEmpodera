name: .NET CI

on:
  push:
    branches: [ import_exel ]
  pull_request:
    branches: [ Import_exel ]

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD || format('ci-{0}-{1}-{2}', github.run_id, github.run_attempt, github.job) }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore InsEmpodera.Tests/InsEmpodera.Tests.csproj

    - name: Build
      run: dotnet build InsEmpodera.Tests/InsEmpodera.Tests.csproj --no-restore --configuration Release

    - name: Test
      env:
        TEST_MYSQL_CONNECTION: Server=127.0.0.1;Port=3306;User=root;Password=${{ secrets.TEST_MYSQL_PASSWORD || format('ci-{0}-{1}-{2}', github.run_id, github.run_attempt, github.job) }};Allow User Variables=true
      run: dotnet test InsEmpodera.Tests/InsEmpodera.Tests.csproj --no-build --configuration Release

    - name: Publish
      run: dotnet publish InsEmpodera.csproj --no-restore -c Release -o publish

    - name: Upload Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: app
        path: publish
